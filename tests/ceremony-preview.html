<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>獲得演出の表示確認</title><link rel="stylesheet" href="../faithful-style-v066.css"><link rel="stylesheet" href="../hub-style-v111.css"><link rel="stylesheet" href="../polish-v167.css"><style>body{display:block;padding:8px}nav{display:flex;gap:5px;margin-bottom:8px}nav button{padding:5px;font-size:14px}#game{width:1000px;max-width:100%;box-shadow:none}#hub{position:absolute;inset:0;background:#183e34}#hub .hub-modal{position:absolute;inset:0}.small #game{width:569px}</style><nav><button id="compact">スマホサイズ</button><button id="wide">PCサイズ</button></nav><nav id="heroes"></nav><main id="game"><section id="hub"><div id="preview" class="hub-modal reward legend"></div></section></main><script type="module">
import{allies}from'../catalog-v100.mjs';import{rewardContent,rewardTheme,particles}from'../presentation-v166.mjs';import{mountHomeAura}from'../home-aura-v165.mjs';
const ids=['nobunaga','kenshin','hideyoshi','ieyasu','shingen','kazutoyo'];let dispose=()=>{};
const standing=id=>`<img class="standing menu-standing" src="../assets/standing-${id}-v111.webp" alt="${allies.find(a=>a.id===id).name}">`;
// The renderer resolves canonical asset URLs at the project root.
const base=document.createElement('base');base.href='../';document.head.append(base);
function show(id){dispose();const a=allies.find(a=>a.id===id),host=document.querySelector('#preview'),theme=rewardTheme(id,a.rarity);host.className='hub-modal reward '+a.rarity;host.style.setProperty('--ceremony-color',theme.color);host.innerHTML='<div class="modal-sheet">'+rewardContent(a,{isNew:true},id=>`<img class="standing menu-standing" src="./assets/standing-${id}-v111.webp" alt="${a.name}">`)+'</div>';const stop=theme.legend?mountHomeAura(host.querySelector('.reward-character'),id,{alignFeet:true}):()=>{};const stopP=particles(host,{color:theme.color,count:theme.particles});dispose=()=>{stop();stopP()};host.querySelector('#reward-close').onclick=()=>show(id);host.querySelector('#reward-team').onclick=()=>show(id)}
for(const id of ids){const b=document.createElement('button');b.textContent=allies.find(a=>a.id===id).name;b.onclick=()=>show(id);document.querySelector('#heroes').append(b)}document.querySelector('#compact').onclick=()=>document.body.classList.add('small');document.querySelector('#wide').onclick=()=>document.body.classList.remove('small');show('nobunaga');
</script></html>
