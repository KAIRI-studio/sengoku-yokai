<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全16キャラの足元確認</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#eee4c9;color:#234f40;font:15px system-ui,sans-serif}h1{font-size:22px;margin:0 0 8px}p{margin:0 0 16px}#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:1000px;margin:auto}.card{background:#fff9e5;border:1px solid #9aa88e;border-radius:10px;overflow:hidden}.label{display:flex;justify-content:space-between;padding:7px 10px;font-size:14px}.home-character{position:relative;width:100%;aspect-ratio:680/440;background:#bdd7ad url('../assets/field-hd-1-v159.webp') center/cover}.home-legend-aura{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.home-character:after{content:'';position:absolute;left:0;right:0;top:93.181818%;border-top:1px dashed #fff9e9;pointer-events:none}.home-character:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #fff7;pointer-events:none}a{color:inherit}@media(max-width:700px){body{padding:10px}#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.label{font-size:12px}}
</style></head><body><h1>全16キャラの足元確認</h1><p>横線：足元の高さ ／ 縦線：足の中心　<a href="./">ゲームへ</a></p><main id="grid"></main><script type="module">
import{allies}from'../catalog-v100.mjs';import{mountHomeAura}from'../home-aura-v173.mjs';
// Asset paths in the production renderer are relative to the game root.
const base=document.createElement('base');base.href='../';document.head.append(base);
for(const a of allies){const card=document.createElement('section');card.className='card';const label=document.createElement('div');label.className='label';label.textContent=a.name+' ／ '+({legend:'レジェンド',rare:'レア',normal:'ノーマル'}[a.rarity]);const host=document.createElement('div');host.className='home-character '+a.rarity;host.dataset.hero=a.id;card.append(label,host);document.querySelector('#grid').append(card);mountHomeAura(host,a.id,{alignFeet:true,home:true})}
</script></body></html>
