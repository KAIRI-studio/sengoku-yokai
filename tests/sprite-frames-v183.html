<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャラクター描画確認 Ver.1.1.67</title><style>body{margin:0;padding:24px;background:#e6efe9;color:#254b3e;font-family:system-ui,sans-serif}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:22px}button,select{font:inherit;padding:9px 14px;border:1px solid #789786;border-radius:8px;background:#fff9e7}main{max-width:1200px;margin:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:16px 0;background:#cfdfd7;border:1px solid #91ac9d;border-radius:12px;overflow:hidden}figcaption{padding:10px;font-weight:bold;background:#f8f6e9}canvas{display:block;width:100%;height:auto}.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.strip figure{margin:0}.strip figcaption{font-size:12px}p{font-size:14px}#status{font-weight:bold}</style><main><header><h1>キャラクター描画確認</h1><label>キャラクター <select id="hero"></select></label><button id="mode">こうげきを見る</button><button id="pause">とめる</button></header><p id="status">よみこみ中…</p><div class="pair"><figure><figcaption>修正前</figcaption><canvas id="before" width="600" height="390"></canvas></figure><figure><figcaption>修正後</figcaption><canvas id="after" width="600" height="390"></canvas></figure></div><p>修正後の8コマ</p><div class="strip" id="frames"></div></main><script type="module">
import{spriteFrame}from'../sprite-frames-v183.mjs';import{allies,enemies}from'../catalog-v182.mjs';
const [oldMeta,meta]=await Promise.all(['../motion-meta-v100.json','../motion-meta-v183.json'].map(u=>fetch(u).then(r=>r.json()))),units=[...allies,...enemies],select=document.querySelector('#hero');let current,im,walking=true,paused=false,lastFrame=0,token=0;
for(const u of units){const o=document.createElement('option');o.value=u.id;o.textContent=u.name;select.append(o)}select.value='yoshihiro';
function draw(canvas,m,f){const ctx=canvas.getContext('2d'),t=spriteFrame(im,m,f),scale=300/(m.scaleWidth||m.width/4),x=canvas.width*.44,ground=canvas.height-25,sx=f%4*m.width/4;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();if(m.flipped?.includes(f)){ctx.translate(x*2,0);ctx.scale(-1,1)}ctx.drawImage(t.canvas,x-m.anchor*scale+(t.x-sx)*scale,ground+(t.y-m.feet[f])*scale,t.width*scale,t.height*scale);ctx.restore()}
async function load(){im=null;const serial=++token;current=select.value;document.querySelector('#status').textContent='よみこみ中…';const u=units.find(u=>u.id===current),image=new Image();image.src='../'+(u.asset||`assets/motion-${current}-v050.webp`);await image.decode();if(serial!==token)return;im=image;document.querySelector('#frames').replaceChildren();for(let f=0;f<8;f++){const fig=document.createElement('figure'),label=document.createElement('figcaption'),c=document.createElement('canvas');label.textContent='コマ '+(f+1);c.width=600;c.height=390;fig.append(label,c);document.querySelector('#frames').append(fig);draw(c,meta[current],f)}document.querySelector('#status').textContent=u.name+'：8コマ よみこみ完了'}
select.onchange=load;document.querySelector('#mode').onclick=()=>{walking=!walking;document.querySelector('#mode').textContent=walking?'こうげきを見る':'あるきを見る'};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'うごかす':'とめる'};
function tick(now){if(im&&!paused){lastFrame=(walking?0:4)+Math.floor(now/(walking?160:220))%4;draw(document.querySelector('#before'),oldMeta[current],lastFrame);draw(document.querySelector('#after'),meta[current],lastFrame)}requestAnimationFrame(tick)}await load();requestAnimationFrame(tick);
</script></html>
