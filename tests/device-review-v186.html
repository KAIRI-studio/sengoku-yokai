<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>端末サイズ確認</title><style>body{font:14px system-ui;margin:16px;background:#edf1e6;color:#274938}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select,button{font:inherit;padding:8px}#frame{border:1px solid #58694c;transform-origin:top left;background:#fff}#holder{overflow:auto}p{margin:8px 0}</style><header><strong>端末サイズ確認</strong><label>画面 <select id="device"><option value="1366,768">PC 1366 × 768</option><option value="1024,768">タブレット横 1024 × 768</option><option value="768,1024">タブレット縦 768 × 1024</option><option value="844,390">スマホ横 844 × 390</option><option value="667,375">小型スマホ横 667 × 375</option><option value="390,844">スマホ縦 390 × 844</option></select></label><button id="reset">タイトルから</button><output id="size"></output></header><p>画面サイズによるレイアウトの確認用。タッチ操作、Safari、実機の処理速度・安全領域を再現するものではありません。</p><div id="holder"><iframe title="ゲームの確認画面" id="frame" src="../"></iframe></div><script>const f=document.querySelector('#frame'),d=document.querySelector('#device');function fit(){const[w,h]=d.value.split(',').map(Number);const scale=Math.min(1,(innerWidth-40)/w,(innerHeight-115)/h);f.style.width=w+'px';f.style.height=h+'px';f.style.transform=`scale(${scale})`;document.querySelector('#holder').style.height=h*scale+4+'px';document.querySelector('#size').textContent=w+' × '+h+' CSS px'}d.onchange=fit;onresize=fit;document.querySelector('#reset').onclick=()=>f.src='../';fit();</script></html>
