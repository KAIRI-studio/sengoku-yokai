<style>
*{box-sizing:border-box}body{margin:0;background:#f2e9d1;color:#244d41;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;padding:20px 12px}main{max-width:1080px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}h1{font-size:clamp(20px,3vw,29px);margin:0;letter-spacing:.04em}.tag{font-size:13px;border:1px solid #b0b59e;border-radius:999px;padding:6px 12px;white-space:nowrap}.stage{position:relative;aspect-ratio:2;background:#78b5aa url('../assets/field-hd-1-v159.webp') center/cover;border:3px solid #345747;border-radius:18px;overflow:hidden;box-shadow:0 14px 30px #244d4124}.stage:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 70px #244d4126;pointer-events:none}#puppet{display:block;width:100%;height:100%}#status{position:absolute;top:14px;left:14px;background:#fff8dfed;border:1px solid #c9b984;border-radius:10px;padding:7px 14px;font-size:15px;margin:0}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}button,a{font:inherit}button{border:2px solid #345747;color:#244d41;background:#fff9e7;border-radius:11px;min-height:46px;padding:9px 18px;cursor:pointer;font-weight:700}button:first-child{background:#ffda77}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e29924;outline-offset:4px}button:disabled{opacity:.5;cursor:wait}.note{text-align:center;font-size:14px;line-height:1.7;margin:14px 0}details{max-width:760px;margin:18px auto}summary{cursor:pointer;text-align:center;font-size:14px;padding:12px}.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.parts figure{margin:0;background:#e0e4d7;border:1px solid #b0b59e;border-radius:10px;padding:10px;text-align:center}.parts canvas{width:100%;height:130px;object-fit:contain}.parts figcaption{font-size:13px;margin-top:6px}footer{text-align:center;margin-top:14px}a{color:#345747;font-size:14px}@media(max-width:700px){body{padding:10px 8px}header{margin-bottom:10px}.
