<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音の動作確認 Ver.1.1.68</title><link rel="stylesheet" href="../audio-v184.css"><style>body{font:16px system-ui;background:#edf1df;color:#31533f;margin:24px}main{max-width:850px;margin:auto}h1{font-size:24px}section{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button{padding:12px 16px;border:1px solid #9daa78;border-radius:10px;background:#fff8d8;font:inherit;color:inherit}output{display:block;white-space:pre-line;background:#fffdf0;border:1px solid #b1bb8b;border-radius:12px;padding:16px;line-height:1.8}</style><main><h1>音の動作確認</h1><section><button id="start">音を はじめる</button><button data-audio-settings>おとの せってい</button><button id="home">ホームBGM</button><button id="battle">戦闘BGM</button><button id="pause">一時停止</button><button id="resume">再開</button></section><section id="effects"></section><output id="status">音を はじめる を押してください。</output></main><script type="module">
import{gameAudio,CUES}from'../audio-v184.mjs';import{mountAudioSettings}from'../audio-ui-v184.mjs';mountAudioSettings();const $=s=>document.querySelector(s);let message='音を はじめる を押してください。';$('#start').onclick=async()=>{message=await gameAudio.unlock()?'音の再生を開始しました':'音を開始できませんでした'};$('#home').onclick=()=>gameAudio.setScene('home');$('#battle').onclick=()=>gameAudio.beginBattle();$('#pause').onclick=()=>gameAudio.setPaused(true);$('#resume').onclick=()=>gameAudio.setPaused(false);
for(const[name,label]of Object.entries({button:'ボタン',attack:'こうげき',skill:'ひっさつ',gacha:'ガチャ',correct:'せいかい',wrong:'ふせいかい',win:'しょうり',lose:'はいぼく'})){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(['attack','skill'].includes(name)&&gameAudio.scene!=='battle')gameAudio.beginBattle();const ok=await gameAudio.effect(name);message=label+'：'+(ok?'再生しました':'待機・制限中')};$('#effects').append(b)}
setInterval(()=>{$('#status').textContent=message+'\n音の状態：'+(gameAudio.ctx?.state||'未開始')+'\nBGM：'+(gameAudio.music?.name||'停止')+'\n一時停止：'+gameAudio.paused+'\n読み込み済み音源：'+gameAudio.buffers.size+'\n効果音の重なり：'+gameAudio.voices.size+'\nBGM '+Math.round(gameAudio.settings.bgm*100)+'% ／ 効果音 '+Math.round(gameAudio.settings.se*100)+'% ／ ミュート '+gameAudio.settings.muted},150);
</script></html>
