<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0d2"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./faithful.webmanifest"><link rel="icon" href="./assets/icon.svg"><link rel="stylesheet" href="./faithful-style-v050.css"><title>せんごく ようかい 合戦 Ver.0.5.0</title></head><body><main id="game" aria-label="せんごく ようかい 合戦">
