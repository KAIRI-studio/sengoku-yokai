<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff1d5"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./lane.webmanifest"><link rel="icon" href="./assets/icon.svg"><link rel="stylesheet" href="./lane-style-v040.css"><title>せんごく ようかい — よこむき合戦 Ver.0.4.0</title></head><body>
<main id="game" aria-label="横むき合戦"><section id="field" aria-label="戦場"><div class="hud"><span class="stage">その1 <small>お寺のてんぐ</small></span><div class="rice" aria-label="出撃に使うおこめ"><span>🍙</span><strong id="rice">1000</strong><small>/ 2000</small></div><button id="pause" aria-label="おやすみ">Ⅱ</button></div>
<div class="base home"><b>お城</b><div class="hp"><i id="home-hp"></i></div><small id="home-number">3000 / 3000</small></div><div class="base enemy"><b>ようかいのお寺</b><div class="hp"><i id="temple-hp"></i></div><small id="temple-number">4600 / 4600</small></div>
<div id="units"></div><div id="effects" aria-hidden="true"></div><p id="hint">顔をタップして なかまを出そう！</p><div id="cutin" aria-live="polite" hidden></div></section>
<section id="dock" aria-label="なかまを出す"><div id="cards"></div><footer><span id="status" role="status">おこめは じどうで ふえるよ</span><button id="restart">もういちど ↻</button></footer></section>
<div id="intro" class="overlay"><div class="introbox"><span class="eyebrow">Ver.0.4.0 · よこむき合戦</span><h1>せんごく<br><em>ようかい</em></h1><p>顔をタップして なかまを出そう！<br>ひっさつは たまると じどうで出るよ。</p><button id="start" class="primary">合戦を はじめる →</button><small>スマホを よこにすると あそびやすいよ</small></div></div>
<div id="result" class="overlay" hidden><div class="resultbox"><h2 id="result-title"></h2><p id="result-copy"></p><button id="retry" class="primary">もういちど あそぶ ↻</button></div></div></main><script type="module" src="./lane-app-v040.mjs"></script></body></html>
