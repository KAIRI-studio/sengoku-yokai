<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>せんごく ようかい｜3しゅるいのカード</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7e4;color:#443021;font-family:system-ui,sans-serif}main{max-width:1672px;margin:auto}header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 18px}h1{font-size:17px;margin:0}button{font:inherit;border:2px solid #60442b;border-radius:20px;padding:7px 16px;background:#fff;color:#443021;cursor:pointer}.scene{position:relative;width:100%;aspect-ratio:1672/941;background:url('./assets/lane-rarity-concept-v1.webp') center/100% 100% no-repeat;overflow:hidden}.fx{position:absolute;top:71.6%;height:26%;width:14.8%;pointer-events:none;border-radius:8%;overflow:hidden;mix-blend-mode:screen}.one{left:19%}.two{left:34.6%}.three{left:50.2%}.rare{left:66.2%;width:14.3%}.fx:before{content:'';position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,#fff6 47%,#fff0 52%,transparent 60%);transform:translateX(-70%);animation:shine 4.8s ease-in-out infinite}.two:before{animation-delay:1.1s}.three:before{animation-delay:2.2s}.rare:before{animation-duration:7s;animation-delay:1.8s;opacity:.65}.star{position:absolute;width:15%;aspect-ratio:1;background:radial-gradient(circle,#fff 8%,#fffaca 22%,#fff8 42%,transparent 70%);filter:drop-shadow(0 0 4px #ffe888);animation:twinkle 2.8s ease-in-out infinite;opacity:0}.star:before,.star:after{content:'';position:absolute;inset:10% 43%;background:white;border-radius:50%}.star:after{transform:rotate(90deg)}.star:nth-child(1){left:2%;top:4%}.star:nth-child(2){right:0;top:44%;animation-delay:.9s}.star:nth-child(3){left:12%;bottom:0;animation-delay:1.8s}.star:nth-child(4){right:3%;top:0;animation-delay:2.4s}.rare .star{filter:drop-shadow(0 0 4px #b7eaff);animation-duration:4.5s;width:12%}.rare .star:nth-child(n+3){display:none}.paused *,.paused:before{animation-play-state:paused!important}p{padding:0 18px;font-size:14px;line-height:1.8}@keyframes shine{0%,40%{transform:translateX(-70%);opacity:0}50%{opacity:.8}75%,100%{transform:translateX(70%);opacity:0}}@keyframes twinkle{0%,60%,100%{opacity:0;transform:scale(.25) rotate(0)}75%{opacity:1;transform:scale(1.05) rotate(15deg)}87%{opacity:.5;transform:scale(.65) rotate(30deg)}}@media(prefers-reduced-motion:reduce){.fx:before,.star{animation:none}.star{opacity:.65}}
</style>
<main><header><h1>カードのキラキラ おためし</h1><button id="toggle" aria-pressed="false">キラキラを とめる</button></header><div class="scene" role="img" aria-label="横むきの戦国とようかいの合戦。緑のノーマル、赤と金のレジェンド、銀のレアのカード。"><div class="fx one"></div><div class="fx two"></div><div class="fx three"></div><div class="fx rare"></div></div><p>レジェンド：赤と金の枠・キラキラ多め　／　レア：銀の枠・キラキラひかえめ　／　ノーマル：緑・キラキラなし<br>見た目とエフェクトの試作です。横むきのゲーム操作は、まだ入っていません。</p></main>
<script>document.querySelectorAll('.fx').forEach(e=>{for(let i=0;i<4;i++){const s=document.createElement('i');s.className='star';e.append(s)}});document.getElementById('toggle').onclick=function(){const p=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',p);this.textContent=p?'キラキラを うごかす':'キラキラを とめる';document.querySelectorAll('.fx').forEach(e=>e.classList.toggle('paused',p))};</script></html>
